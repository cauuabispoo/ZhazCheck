<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZhazCheck</title>
    <link rel="shortcut icon" href="../img/favicon8.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tela_checklist/tela_checklist.css">
    <link rel="stylesheet" href="../css/css_geral/select.css">
    <link rel="stylesheet" href="../css/css_geral/header.css">
    <link rel="stylesheet" href="../css/css_geral/footer.css">
    <link rel="stylesheet" href="../css/css_geral/botaoAdd.css">
</head>

<body>
    <header>
        <div class="logo_caixa">
            <h1 class="logo_titulo">ZhazCheck</h1>
        </div>
    </header>



    <main>
        <div id="alertBox" class="alert-box hidden">Por favor, preencha todos os campos</div>

        <div style="position: relative; margin-top: 3%;">
            <h1 class="potencial1">Checklist</h1>
            <div id="checklist-container"></div>

            <div class="teste">
                <button id="add" class="Btn">
                    <div class="sign">+</div>
                    <div class="text">Adicionar</div>
                </button>
            </div>
        </div>
        <div id="additionalContent"></div>

        <!-- Modal HTML -->
        <div id="confirmModal" class="modalConfirmacao hidden">
            <div class="modal-content-confirmacao">
                <h2 id="modalText">Deseja finalizar o laudo?</h2>
                <div class="modal-buttons">
                    <button id="confirmBtn" class="confirm">Sim</button>
                    <button id="cancelBtn" class="cancel">Não</button>
                </div>
            </div>
        </div>


        <div id="modal" class="modal">
            <div class="modal-content">
                <div class="flex">
                    <br>
                    <h2 style="flex-grow: 2;">Detalhes do Item Reprovado</h2>
                    <button class="button" id="closeModal">
                        <span class="X"></span>
                        <span class="Y"></span>
                    </button>
                </div>

                <!-- Seções Dinâmicas -->
                <div id="dynamicSections" class="flex"></div>
                <button id="adicionar" class="botao_continuar">Adicionar</button>

            </div>
        </div>

        <div class="div_voltar">
            <button id="goBack" class="botao_voltar">Voltar</button>
            <button id="submitButton" class="botao_continuar">Continuar</button>
        </div>

    </main>

    <footer>
        <div>
            <p class="idea">Desenvolvido por</p>
            <h1 class="assinatura">CB</h1>
        </div>
    </footer>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
    <script src="../js/tela_checklist/tela_checklist.js"></script>
</body>

</html>
